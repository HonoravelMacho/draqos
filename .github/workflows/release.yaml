name: Release

# Tag v* (e.g. v0.1.0) -> builds every artifact and publishes the Release.
# APK signing: provide secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEY_ALIAS,
# ANDROID_KEY_PASSWORD, ANDROID_STORE_PASSWORD for a store-signed APK.
# Without them, a debug-signed APK is published and the README says so.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev
      - name: Build daemon (native exe)
        run: |
          mkdir -p build
          dart compile exe packages/draqos_server/bin/draqosd.dart -o build/draqosd
      - name: Build Linux desktop app
        working-directory: apps/draqos_app
        run: |
          flutter build linux --release
          ls build/linux/x64/release/bundle
      - name: Install nfpm
        run: |
          curl -sSL -o /tmp/nfpm.deb https://github.com/goreleaser/nfpm/releases/download/v2.35.1/nfpm_2.35.1_amd64.deb
          sudo dpkg -i /tmp/nfpm.deb
      - name: Assemble staging tree
        run: bash packaging/linux/stage.sh "${GITHUB_REF_NAME#v}"
      - name: Build .deb and .rpm
        env:
          VERSION: ${GITHUB_REF_NAME#v}
        run: |
          mkdir -p dist
          nfpm package --config packaging/linux/nfpm_deb.yaml --packager deb \
            --target "dist/draqos_${GITHUB_REF_NAME#v}_amd64.deb"
          nfpm package --config packaging/linux/nfpm_rpm.yaml --packager rpm \
            --target "dist/draqos-${GITHUB_REF_NAME#v}-1.x86_64.rpm"
      - name: Build .tar.gz
        run: bash packaging/linux/build_tarball.sh "${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-dist
          path: dist/

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Keystore from secrets (optional)
        id: keystore
        working-directory: apps/draqos_app
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > /tmp/release.jks
            {
              echo "storeFile=/tmp/release.jks";
              echo "storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}";
              echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}";
              echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}";
            } > android/key.properties
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build signed release APK
        if: steps.keystore.outputs.signed == 'true'
        working-directory: apps/draqos_app
        run: |
          flutter build apk --release
          mkdir -p ../../dist
          cp build/app/outputs/flutter-apk/app-release.apk \
             "../../dist/draqos-${GITHUB_REF_NAME}-android.apk"
      - name: Build debug-signed APK (no secrets)
        if: steps.keystore.outputs.signed != 'true'
        working-directory: apps/draqos_app
        run: |
          flutter build apk --debug
          mkdir -p ../../dist
          cp build/app/outputs/flutter-apk/app-debug.apk \
             "../../dist/draqos-${GITHUB_REF_NAME}-android-debug.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android-dist
          path: dist/

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build daemon (native exe)
        run: |
          mkdir -p build
          dart compile exe packages/draqos_server/bin/draqosd.dart -o build/draqosd.exe
      - name: Build Windows desktop app
        working-directory: apps/draqos_app
        run: flutter build windows --release
      - name: Install Inno Setup
        run: choco install innosetup -y
      - name: Build installer
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart("v")
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=$ver packaging/windows/draqos.iss
          mkdir dist
          Move-Item packaging/windows/Output/*.exe dist/
      - uses: actions/upload-artifact@v4
        with:
          name: windows-dist
          path: dist/

  publish:
    needs: [linux, android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist/
      - name: SHA256SUMS
        run: (cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS)
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
